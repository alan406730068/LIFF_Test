<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body>
    <h2>Flex Message 分享器</h2>
    <button id="sendBtn" style="padding: 20px;">點我挑選好友並傳送</button>

    <script>
        // 初始化 LIFF
        liff.init({ liffId: "2009050000-ZGl1KWVU" }).then(() => {
            if (!liff.isLoggedIn()) {
                liff.login();
            }
        });

        document.getElementById('sendBtn').onclick = function() {
            // 檢查是否支援分享功能
            if (liff.isApiAvailable('shareTargetPicker')) {
                liff.shareTargetPicker([
                    {
                        "type": "flex",
                        "altText": "闕苙安 傳送了禮物", // 預覽文字
                        "contents": 
						{
						"type": "bubble",
						"size": "hecto",
						"hero": {
							"type": "image",
							"url": "https://i.imgur.com/f55KnYX.png",
							"size": "full",
							"aspectRatio": "20:13",
							"aspectMode": "cover",
							"action": {
							"type": "uri",
							"uri": "https://line.me/"
							}
						},
						"body": {
							"type": "box",
							"layout": "horizontal",
							"contents": [
							{
								  "type": "bubble",
								  "size": "hecto",
								  "hero": {
								    "type": "image",
								    "url": "https://i.imgur.com/f55KnYX.png",
								    "size": "full",
								    "aspectRatio": "20:13",
								    "aspectMode": "cover",
								    "action": {
								      "type": "uri",
								      "uri": "https://line.me/"
								    }
								  },
								  "body": {
								    "type": "box",
								    "layout": "horizontal",
								    "contents": [
								      {
								        "type": "image",
								        "url": "https://lcp-prod-obs.line-scdn.net/0hIixhXu-uFkZFEQPBEdlpERRMGjd2YBJOLGkLe2FUGgBsfzplIC4xIyERGwBgfCpPBX8JfxASMykIKQJyEnc4RRQUG3QTYTl1ETwxax9LNAMYfQF1eD8/f300"
								      },
								      {
								        "type": "text",
								        "text": "【星巴克】1688元禮物即享券(分次使用．無效期)",
								        "weight": "bold",
								        "size": "md",
								        "offsetBottom": "none",
								        "offsetStart": "none",
								        "offsetEnd": "none",
								        "offsetTop": "lg",
								        "wrap": true,
								        "align": "end"
								      }
								    ]
								  },
								  "footer": {
								    "type": "box",
								    "layout": "vertical",
								    "spacing": "sm",
								    "contents": [
								      {
								        "type": "button",
								        "style": "secondary",
								        "height": "sm",
								        "action": {
								          "type": "uri",
								          "label": "打開我的禮物",
								          "uri": "https://cdn.cdnstep.com/s4Maq2uaEfNoduR3Lus5/0-1.png"
								        }
								      },
								      {
								        "type": "button",
								        "action": {
								          "type": "uri",
								          "label": "挑選感謝禮物",
								          "uri": "https://cdn.cdnstep.com/s4Maq2uaEfNoduR3Lus5/0-1.png"
								        },
								        "height": "sm",
								        "style": "secondary"
								      },
								      {
								        "type": "button",
								        "style": "link",
								        "height": "sm",
								        "action": {
								          "type": "uri",
								          "label": "傳送感謝小卡",
								          "uri": "https://cdn.cdnstep.com/s4Maq2uaEfNoduR3Lus5/0-1.png"
								        }
								      },
								      {
								        "type": "separator",
								        "margin": "10px"
								      },
								      {
								        "type": "box",
								        "layout": "baseline",
								        "contents": [
								          {
								            "type": "icon",
								            "url": "https://cdn-1.webcatalog.io/catalog/line-giftshop/line-giftshop-icon-filled-256.webp?v=1754285198712",
								            "size": "20px",
								            "offsetTop": "4px",
								            "offsetEnd": "2px"
								          },
								          {
								            "type": "text",
								            "text": "LINE 禮物",
								            "size": "sm"
								          },
								          {
								            "type": "icon",
								            "url": "https://i.imgur.com/aKbXQ9D.png"
								          }
								        ],
								        "margin": "10px"
								      }
								    ],
								    "flex": 0
								  }
					}
                ]).then(res => {
                    if (res) { alert("傳送成功！"); }
                }).catch(err => console.error(err));
            }
        };
    </script>
</body>
</html>
